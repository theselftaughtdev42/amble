[project]
name = "amble"
version = "0.1.0"
description = "Simple web app for tracking daily walking"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.9.10",
    "fastapi>=0.138",
    "httpx2>=2.16.2",
    "itsdangerous>=2.2.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
